name: yuncomfyui-license

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u${MYSQL_USER} -p${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  api:
    build:
      context: .
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}?charset=utf8mb4
      JWT_SECRET: ${JWT_SECRET}
      CARD_HASH_PEPPER: ${CARD_HASH_PEPPER}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      ADMIN_TOKEN_MINUTES: ${ADMIN_TOKEN_MINUTES:-480}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-3650}
      DEFAULT_OFFLINE_GRACE_HOURS: ${DEFAULT_OFFLINE_GRACE_HOURS:-72}
      SIGNING_KEY_PATH: /app/secrets/license_ed25519.pem
      SIGNING_KEY_ID: ${SIGNING_KEY_ID:-license-key-2026-01}
    volumes:
      - signing_keys:/app/secrets
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/http.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

volumes:
  mysql_data:
  signing_keys:
  certbot_www:
  letsencrypt:

networks:
  internal:
    driver: bridge
