<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方案一：轻量快用版 - 云创工作台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#13795b',
                        primaryDark: '#0e654b',
                        primaryLight: '#e8f5f0',
                        secondary: '#3468b2',
                        warning: '#a66508',
                        danger: '#b84444',
                        bg: '#f3f5f7',
                    },
                    fontFamily: {
                        sans: ['Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .safe-bottom {
                padding-bottom: env(safe-area-inset-bottom, 0);
            }
            .card-shadow {
                box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            }
        }
    </style>
</head>
<body class="bg-bg text-gray-800 font-sans min-h-screen">
    <!-- 顶部导航 -->
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-9 h-9 rounded-lg bg-primary flex items-center justify-center text-white font-bold">云</div>
                <h1 class="text-lg font-bold text-primaryDark">云创工作台</h1>
            </div>
            <div class="flex items-center gap-3">
                <button class="w-9 h-9 rounded-full flex items-center justify-center text-gray-500 hover:bg-gray-100">
                    <i class="fa fa-bell-o"></i>
                </button>
                <div class="w-9 h-9 rounded-full bg-primaryLight text-primary flex items-center justify-center font-medium">
                    U
                </div>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="max-w-7xl mx-auto px-4 py-5 pb-24 md:pb-8">
        <!-- 欢迎卡片 -->
        <div class="bg-gradient-to-r from-primary to-primaryDark rounded-2xl p-5 text-white mb-6 card-shadow">
            <h2 class="text-xl font-bold mb-1">👋 欢迎回来</h2>
            <p class="text-white/80 text-sm mb-3">今天想创作点什么？</p>
            <div class="flex gap-3">
                <div class="bg-white/20 rounded-lg px-3 py-1.5 text-xs">
                    <span class="block text-white/70">今日剩余额度</span>
                    <span class="font-semibold">128 积分</span>
                </div>
                <div class="bg-white/20 rounded-lg px-3 py-1.5 text-xs">
                    <span class="block text-white/70">运行中任务</span>
                    <span class="font-semibold">2 个</span>
                </div>
            </div>
        </div>

        <!-- 常用功能 -->
        <section class="mb-8">
            <h3 class="text-base font-bold mb-4 flex items-center justify-between">
                快速开始
                <span class="text-xs font-normal text-gray-500">常用功能</span>
            </h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                <button class="bg-white rounded-xl p-4 card-shadow hover:shadow-md transition-shadow text-left group">
                    <div class="w-12 h-12 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center text-xl mb-3 group-hover:scale-110 transition-transform">
                        <i class="fa fa-picture-o"></i>
                    </div>
                    <h4 class="font-semibold text-sm mb-1">文生图</h4>
                    <p class="text-xs text-gray-500">输入文字生成图片</p>
                </button>
                <button class="bg-white rounded-xl p-4 card-shadow hover:shadow-md transition-shadow text-left group">
                    <div class="w-12 h-12 rounded-lg bg-purple-50 text-purple-600 flex items-center justify-center text-xl mb-3 group-hover:scale-110 transition-transform">
                        <i class="fa fa-exchange"></i>
                    </div>
                    <h4 class="font-semibold text-sm mb-1">图生图</h4>
                    <p class="text-xs text-gray-500">参考图片风格生成</p>
                </button>
                <button class="bg-white rounded-xl p-4 card-shadow hover:shadow-md transition-shadow text-left group">
                    <div class="w-12 h-12 rounded-lg bg-pink-50 text-pink-600 flex items-center justify-center text-xl mb-3 group-hover:scale-110 transition-transform">
                        <i class="fa fa-film"></i>
                    </div>
                    <h4 class="font-semibold text-sm mb-1">动作迁移</h4>
                    <p class="text-xs text-gray-500">人物跳舞视频生成</p>
                </button>
                <button class="bg-white rounded-xl p-4 card-shadow hover:shadow-md transition-shadow text-left group">
                    <div class="w-12 h-12 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center text-xl mb-3 group-hover:scale-110 transition-transform">
                        <i class="fa fa-magic"></i>
                    </div>
                    <h4 class="font-semibold text-sm mb-1">图片修复</h4>
                    <p class="text-xs text-gray-500">老照片/模糊图修复</p>
                </button>
            </div>
        </section>

        <!-- 进行中任务 -->
        <section class="mb-8">
            <h3 class="text-base font-bold mb-4 flex items-center justify-between">
                进行中
                <a href="#" class="text-xs font-normal text-primary">查看全部 <i class="fa fa-angle-right ml-1"></i></a>
            </h3>
            <div class="space-y-3">
                <div class="bg-white rounded-xl p-4 card-shadow">
                    <div class="flex gap-3">
                        <div class="w-16 h-16 rounded-lg bg-gray-100 overflow-hidden flex-shrink-0">
                            <img src="https://picsum.photos/seed/task1/200/200" alt="任务预览" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-start justify-between mb-1">
                                <h4 class="font-semibold text-sm truncate">赛博朋克风格少女</h4>
                                <span class="text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full flex-shrink-0 ml-2">运行中 62%</span>
                            </div>
                            <p class="text-xs text-gray-500 mb-2 truncate">文生图 · 832×1216 · 30步</p>
                            <div class="w-full h-1.5 bg-gray-100 rounded-full overflow-hidden">
                                <div class="h-full bg-amber-500 rounded-full" style="width: 62%"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-white rounded-xl p-4 card-shadow">
                    <div class="flex gap-3">
                        <div class="w-16 h-16 rounded-lg bg-gray-100 overflow-hidden flex-shrink-0">
                            <img src="https://picsum.photos/seed/task2/200/200" alt="任务预览" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-start justify-between mb-1">
                                <h4 class="font-semibold text-sm truncate">古风舞蹈视频</h4>
                                <span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full flex-shrink-0 ml-2">排队中</span>
                            </div>
                            <p class="text-xs text-gray-500 mb-2 truncate">动作迁移 · 5秒视频 · 24帧</p>
                            <div class="w-full h-1.5 bg-gray-100 rounded-full overflow-hidden">
                                <div class="h-full bg-blue-500 rounded-full" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 最近作品 -->
        <section>
            <h3 class="text-base font-bold mb-4 flex items-center justify-between">
                最近作品
                <a href="#" class="text-xs font-normal text-primary">查看全部 <i class="fa fa-angle-right ml-1"></i></a>
            </h3>
            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3">
                <div class="aspect-square rounded-xl overflow-hidden card-shadow group relative">
                    <img src="https://picsum.photos/seed/work1/400/400" alt="作品" class="w-full h-full object-cover group-hover:scale-105 transition-transform">
                    <div class="absolute inset-0 bg-black/0 group-hover:bg-black/30 transition-all flex items-end p-2 opacity-0 group-hover:opacity-100">
                        <button class="w-full h-8 bg-white rounded-lg text-xs font-medium">下载</button>
                    </div>
                </div>
                <div class="aspect-square rounded-xl overflow-hidden card-shadow group relative">
                    <img src="https://picsum.photos/seed/work2/400/400" alt="作品" class="w-full h-full object-cover group-hover:scale-105 transition-transform">
                    <div class="absolute inset-0 bg-black/0 group-hover:bg-black/30 transition-all flex items-end p-2 opacity-0 group-hover:opacity-100">
                        <button class="w-full h-8 bg-white rounded-lg text-xs font-medium">下载</button>
                    </div>
                </div>
                <div class="aspect-square rounded-xl overflow-hidden card-shadow group relative">
                    <img src="https://picsum.photos/seed/work3/400/400" alt="作品" class="w-full h-full object-cover group-hover:scale-105 transition-transform">
                    <div class="absolute inset-0 bg-black/0 group-hover:bg-black/30 transition-all flex items-end p-2 opacity-0 group-hover:opacity-100">
                        <button class="w-full h-8 bg-white rounded-lg text-xs font-medium">下载</button>
                    </div>
                </div>
                <div class="aspect-square rounded-xl overflow-hidden card-shadow group relative">
                    <img src="https://picsum.photos/seed/work4/400/400" alt="作品" class="w-full h-full object-cover group-hover:scale-105 transition-transform">
                    <div class="absolute inset-0 bg-black/0 group-hover:bg-black/30 transition-all flex items-end p-2 opacity-0 group-hover:opacity-100">
                        <button class="w-full h-8 bg-white rounded-lg text-xs font-medium">下载</button>
                    </div>
                </div>
                <div class="aspect-square rounded-xl overflow-hidden card-shadow group relative hidden md:block">
                    <img src="https://picsum.photos/seed/work5/400/400" alt="作品" class="w-full h-full object-cover group-hover:scale-105 transition-transform">
                    <div class="absolute inset-0 bg-black/0 group-hover:bg-black/30 transition-all flex items-end p-2 opacity-0 group-hover:opacity-100">
                        <button class="w-full h-8 bg-white rounded-lg text-xs font-medium">下载</button>
                    </div>
                </div>
                <div class="aspect-square rounded-xl overflow-hidden card-shadow group relative hidden lg:block">
                    <img src="https://picsum.photos/seed/work6/400/400" alt="作品" class="w-full h-full object-cover group-hover:scale-105 transition-transform">
                    <div class="absolute inset-0 bg-black/0 group-hover:bg-black/30 transition-all flex items-end p-2 opacity-0 group-hover:opacity-100">
                        <button class="w-full h-8 bg-white rounded-lg text-xs font-medium">下载</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 移动端底部导航 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 safe-bottom z-30 md:hidden">
        <div class="grid grid-cols-4 h-16">
            <button class="flex flex-col items-center justify-center gap-1 text-primary">
                <i class="fa fa-home text-lg"></i>
                <span class="text-xs font-medium">首页</span>
            </button>
            <button class="flex flex-col items-center justify-center gap-1 text-gray-400">
                <i class="fa fa-th-large text-lg"></i>
                <span class="text-xs">工作流</span>
            </button>
            <button class="flex flex-col items-center justify-center gap-1 text-gray-400">
                <i class="fa fa-folder-o text-lg"></i>
                <span class="text-xs">作品</span>
            </button>
            <button class="flex flex-col items-center justify-center gap-1 text-gray-400">
                <i class="fa fa-user-o text-lg"></i>
                <span class="text-xs">我的</span>
            </button>
        </div>
    </nav>

    <!-- 悬浮创建按钮 (移动端) -->
    <button class="fixed bottom-20 right-4 w-14 h-14 rounded-full bg-primary text-white shadow-lg flex items-center justify-center text-xl z-20 md:hidden hover:bg-primaryDark transition-colors">
        <i class="fa fa-plus"></i>
    </button>
</body>
</html>
